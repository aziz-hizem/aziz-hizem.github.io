<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#65708a"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10142a"/>
      <stop offset="1" stop-color="#0b0e1b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g stroke="#181e33" stroke-width="1">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>

  <text x="80" y="92" font-size="20" font-weight="600" fill="#8e97ae" letter-spacing="4">AZURE PIPELINES · CI</text>

  <!-- CI stages -->
  <g font-size="22" font-weight="600" fill="#e8ecf5" text-anchor="middle">
    <g>
      <rect x="80" y="130" width="200" height="100" rx="14" fill="#111629" stroke="#232a41" stroke-width="2"/>
      <text x="180" y="174">Build</text>
      <text x="180" y="204" font-size="15" font-weight="400" fill="#8e97ae">Python 3.12 · pip</text>
    </g>
    <g>
      <rect x="340" y="130" width="200" height="100" rx="14" fill="#111629" stroke="#232a41" stroke-width="2"/>
      <text x="440" y="174">Test</text>
      <text x="440" y="204" font-size="15" font-weight="400" fill="#8e97ae">pytest · coverage</text>
    </g>
    <g>
      <rect x="600" y="130" width="200" height="100" rx="14" fill="#111629" stroke="#232a41" stroke-width="2"/>
      <text x="700" y="174">Security scan</text>
      <text x="700" y="204" font-size="15" font-weight="400" fill="#8e97ae">Gitleaks · dependency audit</text>
    </g>
    <g>
      <rect x="860" y="130" width="200" height="100" rx="14" fill="#0e2029" stroke="#3dd0c4" stroke-width="2"/>
      <text x="960" y="174" fill="#3dd0c4">Quality gate</text>
      <text x="960" y="204" font-size="15" font-weight="400" fill="#8e97ae">SonarQube · blocks merge</text>
    </g>
  </g>
  <g stroke="#65708a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M280 180H336"/>
    <path d="M540 180H596"/>
    <path d="M800 180H856"/>
  </g>

  <!-- Package -->
  <path d="M960 230V300H640V352" stroke="#65708a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <rect x="520" y="356" width="240" height="90" rx="14" fill="#111629" stroke="#232a41" stroke-width="2"/>
    <text x="640" y="394" font-size="22" font-weight="600" fill="#e8ecf5">Docker image</text>
    <text x="640" y="422" font-size="15" fill="#8e97ae">Azure Container Registry</text>
  </g>

  <!-- CD -->
  <text x="80" y="512" font-size="20" font-weight="600" fill="#8e97ae" letter-spacing="4">RELEASE · CD</text>
  <path d="M640 446V500" stroke="#65708a" stroke-width="3" fill="none"/>
  <path d="M640 500H240V546M640 500V546M640 500H1040V546" stroke="#65708a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g font-size="22" font-weight="600" fill="#e8ecf5" text-anchor="middle">
    <g>
      <rect x="130" y="550" width="220" height="100" rx="14" fill="#111629" stroke="#232a41" stroke-width="2"/>
      <text x="240" y="592">Dev</text>
      <text x="240" y="622" font-size="15" font-weight="400" fill="#8e97ae">auto deploy</text>
    </g>
    <g>
      <rect x="530" y="550" width="220" height="100" rx="14" fill="#111629" stroke="#232a41" stroke-width="2"/>
      <text x="640" y="592">Staging</text>
      <text x="640" y="622" font-size="15" font-weight="400" fill="#8e97ae">integration checks</text>
    </g>
    <g>
      <rect x="930" y="550" width="220" height="100" rx="14" fill="#0e2029" stroke="#3dd0c4" stroke-width="2"/>
      <text x="1040" y="592" fill="#3dd0c4">Production</text>
      <text x="1040" y="622" font-size="15" font-weight="400" fill="#8e97ae">manual approval</text>
    </g>
  </g>
  <g stroke="#3dd0c4" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 8">
    <path d="M350 600H526"/>
    <path d="M750 600H926"/>
  </g>

  <!-- Infra footer -->
  <text x="80" y="700" font-size="16" fill="#65708a">Infrastructure as code: Terraform → Azure Container Registry · Container Apps · Azure SQL</text>
</svg>
