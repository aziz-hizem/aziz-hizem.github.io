<!doctype html>
<!--
  Source of public/og-image.png, the picture shown when the portfolio link is shared
  (LinkedIn, email, WhatsApp...). 1200 x 630. Re-render after editing:
    python tools/render_og_image.py
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #0b0e1b;
    --surface: #111629;
    --line-2: #2f3752;
    --ink: #e8ecf5;
    --muted: #939cb4;
    --dim: #646f8e;
    --accent: #3dd0c4;
    --accent-2: #6ea8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Instrument Sans", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(170, 195, 255, 0.08) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 30% 30%, #000 25%, transparent 90%);
            mask-image: radial-gradient(ellipse 80% 90% at 30% 30%, #000 25%, transparent 90%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .glow.one { width: 640px; height: 640px; left: -200px; top: -260px; opacity: 0.45;
    background: radial-gradient(closest-side, rgba(61, 208, 196, 0.45), rgba(90, 140, 255, 0.25) 60%, transparent); }
  .glow.two { width: 560px; height: 560px; right: -180px; bottom: -300px; opacity: 0.3;
    background: radial-gradient(closest-side, rgba(110, 168, 255, 0.5), transparent); }

  .content { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }

  .top { display: flex; align-items: center; gap: 40px; }
  .ring { padding: 4px; border-radius: 50%; background: linear-gradient(135deg, #2e9c93, #537ebf, #2e9c93);
    box-shadow: 0 24px 70px -24px rgba(61, 208, 196, 0.55); flex-shrink: 0; }
  .ring-inner { padding: 4px; border-radius: 50%; background: var(--bg); }
  .ring img { display: block; width: 168px; height: 168px; border-radius: 50%; object-fit: cover; }

  .name { font-family: "Bricolage Grotesque", sans-serif; font-size: 76px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .role { margin-top: 10px; font-family: "Bricolage Grotesque", sans-serif; font-size: 30px; font-weight: 600; color: var(--muted); letter-spacing: -0.01em; }
  .gradient { background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .badge { margin-top: 18px; display: inline-flex; padding: 1.5px; border-radius: 999px;
    background: conic-gradient(from 118deg, var(--line-2) 0deg, var(--line-2) 245deg, var(--accent) 300deg, var(--accent-2) 332deg, var(--line-2) 360deg); }
  .badge span { display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 14px; border-radius: 999px;
    background: var(--surface); font-size: 19px; color: var(--muted); }
  .badge svg { color: var(--accent); }
  .badge b { color: var(--ink); font-weight: 600; }

  .hook { margin-top: auto; font-family: "Bricolage Grotesque", sans-serif; font-size: 56px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }

  .footer { margin-top: 26px; display: flex; align-items: center; justify-content: space-between; }
  .tags { display: flex; gap: 10px; }
  .tags span { padding: 6px 14px; border-radius: 999px; background: rgba(61, 208, 196, 0.12); color: var(--accent); font-size: 17px; font-weight: 500; }
  .url { font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; font-weight: 700; color: var(--ink); opacity: 0.85; }
  .url i { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="content">
    <div class="top">
      <div class="ring"><div class="ring-inner"><img src="../public/profile.webp" alt="" /></div></div>
      <div>
        <div class="name">Aziz Hizem</div>
        <div class="role">Final-year engineering student at <span class="gradient">INSAT</span></div>
        <div class="badge">
          <span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18" /></svg>
            <span style="padding:0;background:none"><b>Open to internships</b> · 5–6 months, from February 2027</span>
          </span>
        </div>
      </div>
    </div>

    <div class="hook">I <span class="gradient">create and automate</span> things<br />to make life easier.</div>

    <div class="footer">
      <div class="tags">
        <span>Artificial Intelligence</span><span>DevOps &amp; Cloud</span><span>Computing &amp; Automation</span>
      </div>
      <div class="url"><i>~</i>/aziz-hizem.github.io</div>
    </div>
  </div>
</body>
</html>
